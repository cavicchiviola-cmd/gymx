<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Workout Tracker Pro</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <style>
        :root { 
            --primary: #0a84ff; 
            --bg: #000000; 
            --card: #1c1c1e; 
            --text: #ffffff; 
            --text-sec: #8e8e93; 
            --danger: #ff453a; 
            --success: #32d74b; 
            --warning: #ffd60a; 
            --warmup: #ff9f0a; 
            --drop: #bf5af2; 
            --cardio: #34c759;
            --suggest-color: #64d2ff;
        }
        
        /* Base Styles */
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: var(--bg); color: var(--text); margin: 0; padding: 20px; padding-top: 40px; }
        h1, h2, h3, h4 { margin-top: 0; }
        hr { border: none; border-top: 1px solid #3a3a3c; margin: 20px 0; }
        
        /* Views */
        .view { display: none; }
        .view.active { display: block; animation: fadeIn 0.3s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        /* Cards & Containers */
        .card { background: var(--card); padding: 20px; border-radius: 16px; margin-bottom: 16px; box-shadow: 0 8px 24px rgba(0,0,0,0.5); }
        .header-flex { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        
        /* Buttons */
        button { background: var(--primary); color: white; border: none; padding: 14px; border-radius: 12px; font-size: 16px; font-weight: 600; cursor: pointer; width: 100%; transition: transform 0.1s, opacity 0.2s; }
        button:active { transform: scale(0.96); opacity: 0.8; }
        button.secondary { background: #2c2c2e; color: var(--primary); }
        button.danger { background: rgba(255, 69, 58, 0.15); color: var(--danger); }
        button.success { background: var(--success); color: black; }
        button.icon-btn { width: 38px; height: 38px; padding: 0; border-radius: 10px; display: inline-flex; align-items: center; justify-content: center; font-size: 18px; background: #2c2c2e; }
        
        .btn-start-huge { background: var(--primary); color: white; font-weight: 800; font-size: 18px; padding: 20px; box-shadow: 0 4px 20px rgba(10, 132, 255, 0.3); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 25px; border-radius: 16px; }
        
        /* Inputs */
        input[type="text"], input[type="number"], select, textarea { width: 100%; padding: 14px; margin-bottom: 12px; border: 1px solid #3a3a3c; border-radius: 10px; background: #1c1c1e; color: white; font-size: 16px; box-sizing: border-box; outline: none; transition: border-color 0.2s; }
        input:focus, select:focus, textarea:focus { border-color: var(--primary); }
        input::placeholder, textarea::placeholder { color: var(--text-sec); }
        
        /* Set Rows (Workout) */
        .set-row { display: flex; flex-direction: column; margin-bottom: 12px; border-left: 4px solid #3a3a3c; padding-left: 10px; transition: all 0.2s; background: #242426; border-radius: 0 12px 12px 0; padding: 10px 10px 10px 12px; }
        .set-row.completed { border-left-color: var(--success); background: rgba(50, 215, 75, 0.05); }
        .set-row.type-warmup { border-left-color: var(--warmup); }
        .set-row.type-drop { margin-left: 20px; border-left-color: var(--drop); }
        
        .set-main { display: flex; gap: 8px; align-items: center; width: 100%; }
        .set-main input { margin-bottom: 0; padding: 10px; text-align: center; font-weight: bold; }
        
        /* Specific input sizing */
        .kg-input { flex: 1.5; }
        .reps-input { flex: 1; }
        .rir-input { flex: 1; color: var(--warning) !important; }
        
        .action-btn { background: #3a3a3c; color: white; border-radius: 8px; width: 36px; height: 36px; font-weight: bold; display: flex; justify-content: center; align-items: center; padding: 0; font-size: 13px; }
        .action-btn.active-w { background: var(--warmup); color: black; }
        
        /* Labels and Text */
        .set-feedback { font-size: 13px; margin-top: 8px; color: var(--suggest-color); line-height: 1.4; font-weight: 500; }
        .volume-display { font-size: 14px; color: var(--warning); font-weight: bold; margin-top: 10px; text-align: right; }
        .target-text { color: var(--warning); font-size: 13px; padding: 10px; background: rgba(255, 214, 10, 0.1); border-radius: 8px; border-left: 3px solid var(--warning); line-height: 1.4; margin-bottom: 15px; }
        .badge { display: inline-block; padding: 4px 10px; border-radius: 12px; font-size: 11px; font-weight: 800; text-transform: uppercase; margin-left: 8px; }
        
        /* Timers */
        #timerDisplay { font-size: 56px; text-align: center; font-variant-numeric: tabular-nums; margin: 15px 0; font-weight: 800; color: var(--text); letter-spacing: -2px; }
        .total-timer { font-family: monospace; font-size: 18px; font-weight: bold; color: var(--primary); background: #2c2c2e; padding: 6px 12px; border-radius: 8px; }
        
        /* Modals */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 1000; align-items: center; justify-content: center; padding: 20px; box-sizing: border-box; backdrop-filter: blur(5px); }
        .modal.active { display: flex; animation: fadeIn 0.2s; }
        .modal-content { background: var(--card); padding: 25px; border-radius: 20px; width: 100%; max-height: 85vh; overflow-y: auto; }
        
        /* Calendar */
        .cal-header { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; font-size: 12px; color: var(--text-sec); font-weight: bold; margin-bottom: 10px; }
        .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
        .cal-day { background: #2c2c2e; border-radius: 8px; min-height: 50px; display: flex; flex-direction: column; align-items: center; padding: 5px; }
        .cal-dots { display: flex; gap: 3px; flex-wrap: wrap; justify-content: center; margin-top: auto; }
        .cal-dot { width: 6px; height: 6px; border-radius: 50%; }
    </style>
</head>
<body>

    <!-- DASHBOARD -->
    <div id="view-dashboard" class="view active">
        <div class="header-flex">
            <h1>Workout Pro</h1>
            <div style="display:flex; gap:10px;">
                <button class="icon-btn" onclick="switchView('view-history')">📅</button>
                <button class="icon-btn" onclick="apriArchivio('view-dashboard')">🗂️</button>
            </div>
        </div>

        <button class="btn-start-huge" onclick="apriSelezioneScheda()">Inizia Allenamento</button>

        <div class="card">
            <div class="header-flex" style="margin-bottom: 15px;">
                <h3 style="margin:0;">Le tue Schede</h3>
                <button class="secondary" style="width: auto; padding: 6px 12px; font-size: 13px;" onclick="creaNuovaScheda()">+ Nuova</button>
            </div>
            <div id="routinesContainer"></div>
        </div>

        <div style="text-align: center; margin-top: 30px;">
            <p style="font-size: 12px; color: var(--text-sec);">Backup Dati JSON</p>
            <div style="display: flex; gap: 10px; justify-content: center;">
                <button class="secondary" style="width: auto; padding: 8px 15px; font-size: 13px;" onclick="esportaBackup()">💾 Esporta</button>
                <button class="secondary" style="width: auto; padding: 8px 15px; font-size: 13px;" onclick="document.getElementById('importFile').click()">📂 Importa</button>
                <input type="file" id="importFile" style="display:none" accept=".json" onchange="importaBackup(event)">
            </div>
        </div>
    </div>

    <!-- ARCHIVIO (Omitted standard views for brevity, keeping structure intact) -->
    <div id="view-archive" class="view">
        <div class="header-flex">
            <h2>Archivio Dati</h2>
            <button class="secondary" style="width: auto; padding: 8px 15px;" onclick="chiudiArchivio()">Chiudi</button>
        </div>
        <div id="archiveContainer"></div>
    </div>

    <!-- EDITOR SCHEDA -->
    <div id="view-edit-routine" class="view">
        <div class="header-flex">
            <h2 id="editRoutineName" style="margin: 0;">Modifica Scheda</h2>
            <button class="success" style="width: auto; padding: 8px 15px;" onclick="salvaModificheScheda()">Salva</button>
        </div>
        <div class="card" id="editExercisesContainer"></div>
    </div>

    <!-- WORKOUT ATTIVO -->
    <div id="view-workout" class="view">
        <div class="header-flex" style="margin-bottom: 10px;">
            <h3 id="woRoutineName" style="margin: 0; color: var(--primary);">Nome Scheda</h3>
            <div id="totalWorkoutTimer" class="total-timer">00:00</div>
        </div>
        
        <div class="card">
            <div class="header-flex" style="margin-bottom: 10px;">
                <span id="woProgress" style="font-size: 14px; color: var(--text-sec); font-weight: bold;">Esercizio 1 di X</span>
                <button class="secondary" style="width: auto; padding: 6px 12px; font-size: 12px;" onclick="sostituisciEsercizioCorrente()">✏️ Cambia</button>
            </div>
            
            <h2 id="woExerciseName" style="margin-bottom: 15px; font-size: 24px;">Nome Esercizio</h2>
            
            <p class="target-text" id="woTargetData" style="display:none;"></p>
            
            <!-- CONTENITORE SERIE -->
            <div id="setsContainer"></div>
            
            <div id="volumeLiveDisplay" class="volume-display" style="display:none;">Volume Load: 0 kg</div>

            <button class="secondary" onclick="aggiungiSerie('normal')" style="margin-top: 15px; border: 1px dashed #3a3a3c;">+ Aggiungi Serie</button>
            
            <textarea id="woExerciseNotes" placeholder="Note (es. RIR desiderato, altezza sellino...)" style="margin-top: 15px; font-size: 14px; min-height: 60px;" oninput="salvaStatoWorkout()"></textarea>

            <hr>
            
            <h4 style="text-align:center; color: var(--text-sec); margin-bottom: 0;">Recupero</h4>
            <div id="timerDisplay">00:00</div>
            <div style="display:flex; gap:10px;">
                <button class="secondary" onclick="avviaTimer(60)">60s</button>
                <button class="secondary" onclick="avviaTimer(90)">90s</button>
                <button class="secondary" onclick="avviaTimer(120)">120s</button>
                <button class="danger" style="width: 50px; background: #2c2c2e;" onclick="fermaTimer()">⏹</button>
            </div>
        </div>
        
        <div style="display:flex; gap:10px;">
            <button class="danger" style="flex: 0.4;" onclick="annullaWorkout()">Annulla</button>
            <button id="btnPrevExercise" class="secondary" style="flex: 0.4; display:none;" onclick="precedenteEsercizio()">Indietro</button>
            <button id="btnNextExercise" class="success" style="flex: 1;" onclick="prossimoEsercizio()">Prossimo ➔</button>
        </div>
    </div>

    <!-- STORICO CALENDARIO -->
    <div id="view-history" class="view">
        <div class="header-flex">
            <h2>Calendario</h2>
            <button class="secondary" style="width: auto; padding: 8px 15px;" onclick="switchView('view-dashboard')">Chiudi</button>
        </div>
        <div class="card">
            <h3 id="calMonthTitle" style="text-align: center; margin-bottom: 20px;">Mese Corrente</h3>
            <div class="cal-header">
                <div>L</div><div>M</div><div>M</div><div>G</div><div>V</div><div>S</div><div>D</div>
            </div>
            <div class="cal-grid" id="calendarGrid"></div>
        </div>
    </div>

    <div id="dataModal" class="modal">
        <div class="modal-content">
            <span style="float:right; font-size: 24px; cursor: pointer; color: var(--text-sec);" onclick="chiudiModale()">&times;</span>
            <h3 id="modalTitle" style="margin-bottom: 20px;">Titolo</h3>
            <div id="modalBody"></div>
        </div>
    </div>

<script>
    // --- GESTIONE DATI E INIZIALIZZAZIONE ---
    const ST_GROUPS = [
        { name: "Glutei", hex: "#bf5af2" }, { name: "Quadricipiti", hex: "#0a84ff" },
        { name: "Femorali", hex: "#ff9f0a" }, { name: "Pettorali", hex: "#ff453a" },
        { name: "Dorso", hex: "#32ade6" }, { name: "Spalle", hex: "#ffd60a" },
        { name: "Bicipiti", hex: "#30d158" }, { name: "Tricipiti", hex: "#ff375f" }
    ];

    let userMuscleMap = JSON.parse(localStorage.getItem('wk_muscle_map')) || { "Hip Thrust": "Glutei", "RDL": "Femorali" };
    let routines = JSON.parse(localStorage.getItem('wk_routines')) || [];
    let historyData = JSON.parse(localStorage.getItem('wk_history')) || [];
    let currentWorkout = {};
    let timerInterval, totalTimerInterval, workoutStartTime, timerEndTime;
    let editIndexRoutine = -1;

    function normalizzaNome(str) { return str.trim().toLowerCase().replace(/\b\w/g, s => s.toUpperCase()); }
    function ottieniGruppoMuscolare(nome) { return userMuscleMap[normalizzaNome(nome)] || "Altro"; }
    function generaStileBadge(gruppo) { 
        let hex = (ST_GROUPS.find(g => g.name === gruppo) || {hex: "#8e8e93"}).hex; 
        return `background: ${hex}22; color: ${hex}; border: 1px solid ${hex}55;`; 
    }

    function switchView(viewId) {
        document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
        document.getElementById(viewId).classList.add('active');
        if(viewId === 'view-dashboard') renderDashboard();
        if(viewId === 'view-history') renderCalendario();
    }
    
    function chiudiModale() { document.getElementById('dataModal').classList.remove('active'); }

    window.onload = () => {
        let savedSession = localStorage.getItem('wk_active_session');
        if (savedSession && confirm("Riprendere allenamento in sospeso?")) {
            currentWorkout = JSON.parse(savedSession);
            workoutStartTime = currentWorkout.workoutStartTime || Date.now();
            clearInterval(totalTimerInterval); totalTimerInterval = setInterval(aggiornaTimerTotale, 1000);
            switchView('view-workout'); caricaEsercizioCorrente(true);
        } else {
            localStorage.removeItem('wk_active_session');
            renderDashboard();
        }
    };

    // --- LOGICA DASHBOARD E SCHEDE ---
    function renderDashboard() {
        const container = document.getElementById('routinesContainer'); container.innerHTML = "";
        if(routines.length === 0) container.innerHTML = "<p style='color:var(--text-sec); font-size:14px;'>Nessuna scheda. Creane una!</p>";
        
        routines.forEach((r, idx) => {
            container.innerHTML += `
                <div style="background: #242426; border-radius: 12px; padding: 15px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center;">
                    <div>
                        <h4 style="margin: 0; font-size: 16px;">${r.name}</h4>
                        <span style="font-size: 12px; color: var(--text-sec);">${r.exercises.length} esercizi</span>
                    </div>
                    <div style="display:flex; gap: 8px;">
                        <button class="icon-btn" onclick="apriEditorScheda(${idx})">✏️</button>
                    </div>
                </div>`;
        });
    }

    function apriSelezioneScheda() {
        if(routines.length === 0) return alert("Crea prima una scheda!");
        let html = routines.map((r, i) => `
            <button style="margin-bottom:12px; background:#242426; color:var(--primary); text-align:left; padding: 18px;" 
                    onclick="avviaWorkout(${i}); chiudiModale();">
                ▶ ${r.name.toUpperCase()}
            </button>`).join('');
        document.getElementById('modalTitle').innerText = "Seleziona Scheda";
        document.getElementById('modalBody').innerHTML = html;
        document.getElementById('dataModal').classList.add('active');
    }

    function creaNuovaScheda() {
        let nome = prompt("Nome della scheda:");
        if(nome) { routines.push({ name: nome, exercises: [] }); salvaDati(); renderDashboard(); }
    }

    // --- LOGICA WORKOUT E SERIE ---
    function avviaWorkout(idx) {
        let r = routines[idx];
        if(r.exercises.length === 0) return alert("Scheda vuota!");
        currentWorkout = { routineName: r.name, exercises: [...r.exercises], currentExIndex: 0, recordedData: [], workoutStartTime: Date.now() };
        workoutStartTime = Date.now();
        clearInterval(totalTimerInterval); totalTimerInterval = setInterval(aggiornaTimerTotale, 1000);
        switchView('view-workout'); caricaEsercizioCorrente();
    }

    function aggiornaTimerTotale() {
        let sec = Math.floor((Date.now() - workoutStartTime) / 1000);
        let m = Math.floor(sec / 60).toString().padStart(2, '0');
        let s = (sec % 60).toString().padStart(2, '0');
        document.getElementById('totalWorkoutTimer').innerText = `${m}:${s}`;
    }

    function caricaEsercizioCorrente(isRestoring = false) {
        let exName = currentWorkout.exercises[currentWorkout.currentExIndex];
        let grp = ottieniGruppoMuscolare(exName);
        
        document.getElementById('woRoutineName').innerText = currentWorkout.routineName;
        document.getElementById('woProgress').innerText = `Esercizio ${currentWorkout.currentExIndex + 1} di ${currentWorkout.exercises.length}`;
        document.getElementById('woExerciseName').innerHTML = `${exName} <span class="badge" style="${generaStileBadge(grp)}">${grp}</span>`;
        
        document.getElementById('setsContainer').innerHTML = "";
        document.getElementById('volumeLiveDisplay').style.display = "none";
        
        // Recupera dati se stiamo ripristinando, altrimenti riga vuota
        let activeData = currentWorkout.recordedData[currentWorkout.currentExIndex];
        if (activeData && activeData.sets.length > 0) {
            activeData.sets.forEach(s => aggiungiSerie(s.type, s.kg, s.reps, s.rir));
        } else {
            aggiungiSerie('normal');
        }

        let btnNext = document.getElementById('btnNextExercise');
        if(currentWorkout.currentExIndex === currentWorkout.exercises.length - 1) {
            btnNext.innerText = "Termina 🏁"; 
        } else {
            btnNext.innerText = "Prossimo ➔"; 
        }
        
        document.getElementById('btnPrevExercise').style.display = currentWorkout.currentExIndex > 0 ? "block" : "none";
        salvaStatoWorkout();
    }

    function aggiungiSerie(tipo = 'normal', kg = "", reps = "", rir = "") {
        const container = document.getElementById('setsContainer');
        const count = container.querySelectorAll('.set-row.type-normal, .set-row.type-warmup').length + 1;
        
        const div = document.createElement('div');
        div.className = `set-row type-${tipo}`;
        div.dataset.type = tipo;
        
        div.innerHTML = `
            <div class="set-main">
                <span style="font-size: 14px; font-weight:bold; color:var(--text-sec); width: 20px;">${tipo === 'drop' ? '↳' : count}</span>
                <input type="number" step="0.5" placeholder="Kg" class="kg-input" value="${kg}" oninput="controllaRiga(this)">
                <input type="number" placeholder="Reps" class="reps-input" value="${reps}" oninput="controllaRiga(this)">
                <input type="number" placeholder="RIR" class="rir-input" value="${rir}" title="Reps in Reserve" oninput="controllaRiga(this)">
                <button class="action-btn" style="background:var(--danger); color:white;" onclick="this.closest('.set-row').remove(); ricalcolaVolume(); salvaStatoWorkout();">X</button>
            </div>
            <div class="set-feedback" style="display:none;"></div>
        `;
        container.appendChild(div);
    }

    function controllaRiga(input) {
        let row = input.closest('.set-row');
        let kg = row.querySelector('.kg-input').value;
        let reps = row.querySelector('.reps-input').value;
        if(kg && reps) row.classList.add('completed');
        else row.classList.remove('completed');
        
        ricalcolaVolume();
        salvaStatoWorkout();
    }

    function ricalcolaVolume() {
        let vol = 0;
        document.querySelectorAll('.set-row').forEach(row => {
            if(row.dataset.type !== 'warmup') {
                let k = parseFloat(row.querySelector('.kg-input').value);
                let r = parseFloat(row.querySelector('.reps-input').value);
                if(!isNaN(k) && !isNaN(r)) vol += (k * r);
            }
        });
        let display = document.getElementById('volumeLiveDisplay');
        if(vol > 0) {
            display.innerText = `Volume Load: ${vol} kg`;
            display.style.display = "block";
        } else {
            display.style.display = "none";
        }
    }

    function salvaStatoWorkout() {
        let sets = [];
        document.querySelectorAll('.set-row').forEach(row => {
            sets.push({
                kg: row.querySelector('.kg-input').value,
                reps: row.querySelector('.reps-input').value,
                rir: row.querySelector('.rir-input').value,
                type: row.dataset.type
            });
        });
        
        currentWorkout.recordedData[currentWorkout.currentExIndex] = {
            name: currentWorkout.exercises[currentWorkout.currentExIndex],
            sets: sets,
            notes: document.getElementById('woExerciseNotes').value
        };
        localStorage.setItem('wk_active_session', JSON.stringify(currentWorkout));
    }

    function prossimoEsercizio() {
        salvaStatoWorkout();
        if(currentWorkout.currentExIndex === currentWorkout.exercises.length - 1) {
            terminaWorkout();
        } else {
            currentWorkout.currentExIndex++;
            caricaEsercizioCorrente();
        }
    }
    
    function precedenteEsercizio() {
        salvaStatoWorkout();
        if(currentWorkout.currentExIndex > 0) {
            currentWorkout.currentExIndex--;
            caricaEsercizioCorrente();
        }
    }

    function terminaWorkout() {
        let cleanData = currentWorkout.recordedData.filter(ex => ex && ex.sets.some(s => s.kg && s.reps));
        historyData.push({
            date: new Date().toLocaleDateString('it-IT'),
            routine: currentWorkout.routineName,
            data: cleanData
        });
        localStorage.setItem('wk_history', JSON.stringify(historyData));
        localStorage.removeItem('wk_active_session');
        alert("Workout Salvato!");
        switchView('view-dashboard');
    }

    function annullaWorkout() {
        if(confirm("Annullare senza salvare?")) {
            localStorage.removeItem('wk_active_session');
            switchView('view-dashboard');
        }
    }

    // --- TIMERS ---
    function avviaTimer(sec) {
        fermaTimer(); timerEndTime = Date.now() + (sec * 1000);
        timerInterval = setInterval(() => {
            let remain = Math.ceil((timerEndTime - Date.now()) / 1000);
            if(remain <= 0) {
                fermaTimer(); document.getElementById('timerDisplay').innerText = "00:00";
                if(navigator.vibrate) navigator.vibrate([300, 150, 300]);
            } else {
                document.getElementById('timerDisplay').innerText = `${Math.floor(remain/60).toString().padStart(2,'0')}:${(remain%60).toString().padStart(2,'0')}`;
            }
        }, 1000);
    }
    function fermaTimer() { clearInterval(timerInterval); document.getElementById('timerDisplay').innerText = "00:00"; }

    function salvaDati() { localStorage.setItem('wk_routines', JSON.stringify(routines)); }

</script>
</body>
</html>
