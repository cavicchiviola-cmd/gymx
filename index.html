<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Workout Tracker PWA</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <!-- TensorFlow.js e Pose Detection (MoveNet) per AI Tracker -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-core"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-converter"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-backend-webgl"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/pose-detection"></script>

    <style>
        :root { 
            --primary: #0a84ff; 
            --bg: #000000; 
            --card: #1c1c1e; 
            --text: #ffffff; 
            --text-sec: #ebebf599; 
            --danger: #ff453a; 
            --success: #30d158; 
            --warning: #ffd60a; 
            --warmup: #ff9f0a; 
            --drop: #bf5af2; 
            --cardio: #34c759;
            --suggest-color: #64d2ff;
        }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: var(--bg); color: var(--text); margin: 0; padding: 20px; padding-top: 50px; }
        h1, h2, h3, h4 { margin-top: 0; }
        .view { display: none; }
        .view.active { display: block; animation: fadeIn 0.2s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        
        .card { background: var(--card); padding: 20px; border-radius: 14px; margin-bottom: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.8); position: relative; }
        button { background: var(--primary); color: white; border: none; padding: 14px; border-radius: 10px; font-size: 16px; font-weight: 600; cursor: pointer; width: 100%; margin-bottom: 10px; transition: transform 0.1s; }
        button:active { transform: scale(0.97); filter: brightness(0.9); }
        button.secondary { background: #3a3a3c; }
        button.danger { background: var(--danger); }
        button.warning { background: var(--warning); color: black; }
        button.icon-btn { width: 36px; height: 36px; padding: 0; border-radius: 6px; display: inline-flex; align-items: center; justify-content: center; font-size: 18px; margin-bottom: 0; background: #3a3a3c; }
        
        .btn-start-huge { background: var(--success); color: black; font-weight: 900; font-size: 20px; padding: 25px; box-shadow: 0 4px 20px rgba(48, 209, 88, 0.3); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 30px; border-radius: 16px; }
        
        input[type="text"], input[type="number"], select, textarea { width: 100%; padding: 12px; margin-bottom: 10px; border: none; border-radius: 8px; background: #2c2c2e; color: white; font-size: 16px; box-sizing: border-box; transition: all 0.2s; outline: none; font-family: inherit; }
        input[type="color"] { background: none; border: none; width: 40px; height: 40px; padding: 0; border-radius: 50%; cursor: pointer; margin-right: 10px; }
        input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
        input[type="color"]::-webkit-color-swatch { border: 2px solid #3a3a3c; border-radius: 50%; }
        
        input::placeholder, textarea::placeholder { color: #636366; }
        input:focus, select:focus, textarea:focus { outline: 2px solid var(--primary); background: #3a3a3c; }
        
        .orange-placeholder::placeholder { color: var(--warmup) !important; opacity: 1; font-weight: bold; }
        
        .set-row { display: flex; flex-direction: column; margin-bottom: 12px; border-left: 3px solid transparent; transition: all 0.3s ease; padding-left: 6px; }
        .set-row.type-normal.completed { border-left-color: var(--success); background-color: rgba(48, 209, 88, 0.05); border-radius: 0 8px 8px 0; padding-top: 4px; padding-bottom: 4px; }
        .set-row.type-warmup.completed { border-left-color: var(--warmup); background-color: rgba(255, 159, 10, 0.05); border-radius: 0 8px 8px 0; padding-top: 4px; padding-bottom: 4px; }
        .set-row.type-drop { margin-left: 20px; border-left-color: var(--drop); opacity: 0.9; }
        .set-row.type-drop.completed { background-color: rgba(191, 90, 242, 0.05); border-radius: 0 8px 8px 0; padding-top: 4px; padding-bottom: 4px; }
        
        .set-main { display: flex; gap: 8px; align-items: center; width: 100%; }
        .set-row input { margin-bottom: 0; flex: 1; min-width: 60px; }
        .set-controls { display: flex; gap: 4px; }
        .action-btn { background: #3a3a3c; color: white; border: none; border-radius: 6px; width: 34px; height: 34px; font-weight: bold; cursor: pointer; display: flex; justify-content: center; align-items: center; padding: 0; margin: 0; font-size: 12px; }
        .action-btn.active-w { background: var(--warmup); }
        .action-btn.danger-btn { background: var(--danger); }
        
        .set-feedback { 
            font-size: 12px; 
            margin-top: 6px; 
            width: 100%; 
            padding-left: 33px; 
            font-weight: 600; 
            color: var(--suggest-color);
            line-height: 1.3;
        }
        
        .badge { display: inline-block; padding: 4px 8px; border-radius: 12px; font-size: 11px; font-weight: 800; text-transform: uppercase; margin-left: 8px; letter-spacing: 0.5px; vertical-align: middle; }
        
        .history-text { color: var(--text-sec); font-size: 14px; margin-bottom: 15px; padding-left: 10px; border-left: 3px solid var(--primary); }
        .target-text { color: var(--warning); font-size: 14px; margin-bottom: 10px; padding-left: 10px; border-left: 3px solid var(--warning); background: rgba(255, 214, 10, 0.1); border-radius: 0 8px 8px 0; padding-top: 8px; padding-bottom: 8px; line-height: 1.4; }
        
        .note-box { width: 100%; min-height: 60px; resize: vertical; margin-top: 10px; margin-bottom: 15px; font-size: 14px; }
        .past-note-badge { background: #2c2c2e; border-left: 3px solid var(--text-sec); padding: 8px 12px; border-radius: 0 8px 8px 0; font-size: 13px; color: var(--text-sec); margin-bottom: 10px; }

        .barbell-math { display: none; background: #2c2c2e; border: 1px solid #3a3a3c; border-radius: 8px; padding: 10px; margin-bottom: 15px; font-size: 14px; }
        .barbell-math span { color: var(--primary); font-weight: bold; }
        
        #timerDisplay { font-size: 48px; text-align: center; font-variant-numeric: tabular-nums; margin: 20px 0; font-weight: bold; color: var(--primary); }
        
        .header-flex { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .progress-text { font-size: 14px; color: var(--primary); font-weight: bold; margin-bottom: 5px; text-transform: uppercase; letter-spacing: 1px; }
        .total-timer { font-family: monospace; font-size: 20px; font-weight: bold; color: var(--primary); background: #1c1c1e; padding: 6px 12px; border-radius: 8px; border: 1px solid #3a3a3c; }
        
        .muscle-group-title { margin-top: 25px; margin-bottom: 10px; font-size: 18px; color: var(--primary); border-bottom: 1px solid #3a3a3c; padding-bottom: 5px; text-transform: uppercase; letter-spacing: 1px; }
        .edit-row { display: flex; justify-content: space-between; align-items: center; background: #2c2c2e; padding: 10px; border-radius: 8px; margin-bottom: 8px; transition: opacity 0.3s; }

        .cal-header { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; font-size: 12px; color: var(--text-sec); font-weight: bold; margin-bottom: 10px; }
        .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
        .cal-day { background: #2c2c2e; border-radius: 6px; min-height: 45px; padding: 4px; display: flex; flex-direction: column; align-items: center; }
        .cal-day-num { font-size: 12px; font-weight: 600; margin-bottom: 4px; }
        .cal-dots { display: flex; gap: 2px; flex-wrap: wrap; justify-content: center; margin-top: auto; padding-bottom: 4px; }
        .cal-dot { width: 8px; height: 8px; border-radius: 50%; }
        .cal-empty { background: transparent; }
        
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 1000; align-items: center; justify-content: center; padding: 20px; box-sizing: border-box;}
        .modal.active { display: flex; animation: fadeIn 0.2s; }
        .modal-content { background: var(--card); padding: 20px; border-radius: 14px; width: 100%; max-height: 85vh; overflow-y: auto; }
        .close-modal { float: right; font-size: 28px; cursor: pointer; color: var(--text-sec); font-weight: bold; line-height: 1; margin-left: 15px;}
        
        select.group-select { padding: 6px; border-radius: 6px; background: #1c1c1e; color: white; border: 1px solid #3a3a3c; font-size: 12px; font-weight: bold; width: 110px; }
        .drag-handle { cursor: grab; font-size: 18px; margin-right: 10px; -webkit-user-drag: element; display: inline-block; }
